name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - name: Build
        run: make build
      - name: Vet
        run: make vet
      - name: Test (race)
        run: make test
      - name: Benchmarks (smoke)
        run: make bench

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27" }
      - uses: golangci/golangci-lint-action@v6
        with: { version: latest, args: --timeout 5m }

  docker:
    needs: [test, lint]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions: { packages: write }
    strategy:
      matrix:
        service: [gateway, recommender, ingestor]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build/Dockerfile.${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository }}/recsplatform/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
