# Horizontal scaling: HPA on CPU plus queue-lag awareness for the ingestor.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: recsplatform
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway}
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # react fast to traffic spikes
    scaleDown:
      stabilizationWindowSeconds: 300 # scale down slowly
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: recommender
  namespace: recsplatform
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: recommender}
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestor
  namespace: recsplatform
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: ingestor}
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
    # Scales on Kafka consumer lag exported by the ingestor; more lag =>
    # more replicas. Partitions cap parallelism, so maxReplicas must stay
    # within the topic's partition count for extra pods to help.
    - type: Pods
      pods:
        metric:
          name: kafka_consumer_lag_seconds
        target: {type: AverageValue, averageValue: "30"}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: recsplatform
spec:
  minAvailable: 2
  selector: {matchLabels: {app: gateway}}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: recommender
  namespace: recsplatform
spec:
  minAvailable: 2
  selector: {matchLabels: {app: recommender}}
