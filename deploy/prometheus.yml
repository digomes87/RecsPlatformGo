global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8080"] }]
  - job_name: recommender
    static_configs: [{ targets: ["recommender:8081"] }]
  - job_name: ingestor
    static_configs: [{ targets: ["ingestor:8082"] }]
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
