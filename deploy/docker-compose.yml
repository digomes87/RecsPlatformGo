# Local development stack: full topology with one command.
# Usage: docker compose up --build
name: recsplatform

services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [mongo-data:/data/db]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:3.7.0
    ports: ["9092:9092"]
    environment:
      # KRaft single-node: no ZooKeeper, closer to modern MSK defaults.
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  recommender:
    build: { context: .., dockerfile: build/Dockerfile.recommender }
    environment: &go-env
      MONGO_URI: mongodb://mongo:27017
      KAFKA_BROKERS: kafka:9092
      REDIS_ADDR: redis:6379
      ENVIRONMENT: dev
      HTTP_ADDR: ":8081"
    ports: ["8081:8081"]
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped

  ingestor:
    build: { context: .., dockerfile: build/Dockerfile.ingestor }
    environment:
      <<: *go-env
      HTTP_ADDR: ":8082"
      SIMILARITY_INTERVAL_SECONDS: "60" # faster loop for local experiments
    ports: ["8082:8082"]
    depends_on:
      mongo: { condition: service_healthy }
      kafka: { condition: service_healthy }
    restart: unless-stopped

  gateway:
    build: { context: .., dockerfile: build/Dockerfile.gateway }
    environment:
      <<: *go-env
      HTTP_ADDR: ":8080"
      RECOMMENDER_URL: http://recommender:8081
      JWT_SECRET: dev-secret-change-me
      RATE_LIMIT_RPS: "200"
      RATE_LIMIT_BURST: "400"
    # Host port 28080: 8080 is commonly taken by local tunnels.
    ports: ["28080:8080"]
    depends_on:
      kafka: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ../deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ../deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../deploy/grafana:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  mongo-data:
